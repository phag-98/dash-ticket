<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dash Ticket</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">🎫</span>
          <span class="logo-text">DashTicket</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-view="dashboard">
          <span class="nav-icon">📊</span> Dashboard
        </a>
        <a href="#" class="nav-item" data-view="tickets">
          <span class="nav-icon">🎫</span> Tickets
        </a>
        <a href="#" class="nav-item" data-view="new">
          <span class="nav-icon">➕</span> Novo Ticket
        </a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <h1 class="page-title" id="page-title">Dashboard</h1>
        <button class="btn btn-primary" id="new-ticket-btn">+ Novo Ticket</button>
      </header>

      <!-- Dashboard View -->
      <section class="view active" id="view-dashboard">
        <div class="stats-grid">
          <div class="stat-card stat-total">
            <div class="stat-value" id="stat-total">0</div>
            <div class="stat-label">Total de Tickets</div>
          </div>
          <div class="stat-card stat-open">
            <div class="stat-value" id="stat-open">0</div>
            <div class="stat-label">Abertos</div>
          </div>
          <div class="stat-card stat-progress">
            <div class="stat-value" id="stat-progress">0</div>
            <div class="stat-label">Em Andamento</div>
          </div>
          <div class="stat-card stat-closed">
            <div class="stat-value" id="stat-closed">0</div>
            <div class="stat-label">Resolvidos</div>
          </div>
        </div>

        <div class="recent-section">
          <h2>Tickets Recentes</h2>
          <div id="recent-tickets" class="ticket-list"></div>
        </div>
      </section>

      <!-- Tickets View -->
      <section class="view" id="view-tickets">
        <div class="filters">
          <input type="text" id="search" class="input" placeholder="Buscar tickets..." />
          <select id="filter-status" class="input">
            <option value="">Todos os status</option>
            <option value="open">Aberto</option>
            <option value="progress">Em Andamento</option>
            <option value="closed">Resolvido</option>
          </select>
          <select id="filter-priority" class="input">
            <option value="">Todas as prioridades</option>
            <option value="low">Baixa</option>
            <option value="medium">Média</option>
            <option value="high">Alta</option>
          </select>
        </div>
        <div id="all-tickets" class="ticket-list"></div>
      </section>

      <!-- New Ticket View -->
      <section class="view" id="view-new">
        <div class="form-card">
          <h2>Criar Novo Ticket</h2>
          <form id="ticket-form">
            <div class="form-group">
              <label>Título *</label>
              <input type="text" id="f-title" class="input" placeholder="Descreva o problema brevemente" required />
            </div>
            <div class="form-group">
              <label>Descrição</label>
              <textarea id="f-desc" class="input" rows="4" placeholder="Detalhes sobre o ticket..."></textarea>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Prioridade</label>
                <select id="f-priority" class="input">
                  <option value="low">Baixa</option>
                  <option value="medium" selected>Média</option>
                  <option value="high">Alta</option>
                </select>
              </div>
              <div class="form-group">
                <label>Categoria</label>
                <select id="f-category" class="input">
                  <option value="bug">Bug</option>
                  <option value="feature">Feature</option>
                  <option value="support">Suporte</option>
                  <option value="other">Outro</option>
                </select>
              </div>
              <div class="form-group">
                <label>Responsável</label>
                <input type="text" id="f-assignee" class="input" placeholder="Nome do responsável" />
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Criar Ticket</button>
              <button type="button" class="btn btn-secondary" id="cancel-btn">Cancelar</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <select id="modal-status" class="input">
          <option value="open">Aberto</option>
          <option value="progress">Em Andamento</option>
          <option value="closed">Resolvido</option>
        </select>
        <button class="btn btn-danger" id="modal-delete">Excluir</button>
        <button class="btn btn-primary" id="modal-save">Salvar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
