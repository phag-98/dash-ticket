<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Botafogo — Ticket Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body { background: #fcf9f8; font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif; }
      button { font-family: inherit; }
      select {
        font-family: inherit;
        background: #f6f3f2;
        color: #1c1b1b;
        border: none;
        border-radius: 6px;
        padding: 4px 8px;
        outline: none;
      }
      select:focus { box-shadow: 0 0 0 2px #c5a14d; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #f6f3f2; }
      ::-webkit-scrollbar-thumb { background: #c5a14d; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #775a08; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
