<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Botafogo — Ticket Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body { background: #efefef; font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif; }
      button { font-family: inherit; }
      select { font-family: inherit; background: #ffffff; color: #1a1a1a; border: 1px solid #d8d8d8; border-radius: 4px; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #e6e6e6; }
      ::-webkit-scrollbar-thumb { background: #C9A84C; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #e0bf6a; }

      /* ── Página Clubes — linha de jogo responsiva ── */
      .bfr-match {
        display: grid;
        grid-template-columns: 150px 1fr 132px 56px;
        grid-template-areas: "meta score publico result";
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        border-top: 1px solid #d8d8d8;
      }
      .bfr-match__meta    { grid-area: meta; min-width: 0; }
      .bfr-match__score   { grid-area: score; display: flex; align-items: center; justify-content: center; gap: 12px; }
      .bfr-match__publico { grid-area: publico; }
      .bfr-match__result  { grid-area: result; }
      .bfr-match__side    { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
      .bfr-match__side--home { justify-content: flex-end; }
      .bfr-match__name    { font-size: 11px; color: #444; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      @media (max-width: 680px) {
        .bfr-match {
          grid-template-columns: 1fr auto;
          grid-template-areas:
            "meta result"
            "score score"
            "publico publico";
          row-gap: 10px;
        }
        .bfr-match__score { justify-content: flex-start; }
        .bfr-match__side  { flex: 0 1 auto; }
        .bfr-match__name  { display: none; } /* só logos + placar no mobile */
      }
</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
