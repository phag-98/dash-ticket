<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Botafogo — Ticket Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; }
      body { background: #efefef; font-family: 'Inter', 'Segoe UI', -apple-system, sans-serif; }
      button { font-family: inherit; }
      select { font-family: inherit; background: #ffffff; color: #1a1a1a; border: 1px solid #d8d8d8; border-radius: 4px; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #e6e6e6; }
      ::-webkit-scrollbar-thumb { background: #C9A84C; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #e0bf6a; }
</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
